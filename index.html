
<!DOCTYPE html>
<html>
<head>
    <title>System Status Checker</title>

    <style>
        body {
            font-family: Arial;
            text-align: center;
            margin-top: 100px;
            background-color: #f2f2f2;
        }

        #banner {
            padding: 20px;
            margin: 20px;
            background-color: orange;
            color: white;
            border-radius: 10px;
            font-size: 20px;
        }

        button {
            padding: 12px 20px;
            background-color: blue;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <h1>Welcome to System Monitor</h1>

    <div id="banner">
        System is Checking...
    </div>

    <button onclick="checkSystem()">
        Check System Status
    </button>

    <script src="script.js"></script>

</body>
</html>
